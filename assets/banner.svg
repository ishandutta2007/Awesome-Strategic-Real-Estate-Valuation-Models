<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background & Accent Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatMedium {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -200; }
      }
      @keyframes scanline {
        0% { transform: translateX(0); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateX(600px); opacity: 0; }
      }

      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatMedium 7s ease-in-out infinite;
      }
      .pulsing-node {
        animation: pulseLight 3s ease-in-out infinite;
      }
      .animated-chart-line {
        stroke-dasharray: 8 6;
        animation: dashAnim 15s linear infinite;
      }
      .accent-glow {
        animation: pulseLight 4s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- BACKGROUND BASE -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- BACKGROUND GRID MATRIX -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="360" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="650" y1="0" x2="650" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- AMBIENT GLOW CIRCLES IN BACKGROUND -->
  <circle cx="100" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="180" fill="#818cf8" opacity="0.1" filter="url(#glow)" />
  <circle cx="900" cy="100" r="130" fill="#34d399" opacity="0.06" filter="url(#glow)" />

  <!-- DYNAMIC BACKGROUND CHARTS & VALUATION METRIC CARDS (POSITIONED AT RIGHT BACKGROUND) -->
  <g opacity="0.85">
    <!-- Valuation Trend Area Chart -->
    <path d="M 680 270 Q 750 250, 820 220 T 960 170 T 1080 130 T 1180 100 L 1180 320 L 680 320 Z" fill="url(#chartGrad)" />
    <!-- Dynamic Animated Chart Line -->
    <path class="animated-chart-line" d="M 680 270 Q 750 250, 820 220 T 960 170 T 1080 130 T 1180 100" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" />

    <!-- Metric Card 1: AVM Accuracy -->
    <g class="floating-card-1" transform="translate(850, 45)">
      <rect width="260" height="92" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" filter="url(#softGlow)" opacity="0.9" />
      <circle cx="28" cy="32" r="10" fill="#38bdf8" opacity="0.2" />
      <circle cx="28" cy="32" r="4" fill="#38bdf8" class="pulsing-node" />
      <text x="48" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AVM PREDICTION ACCURACY</text>
      <text x="26" y="68" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">97.8% <tspan fill="#34d399" font-size="13" font-weight="700">R² = 0.94</tspan></text>
      <text x="175" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">MAPE &lt; 3.2%</text>
    </g>

    <!-- Metric Card 2: Market Assessment Scale -->
    <g class="floating-card-2" transform="translate(730, 160)">
      <rect width="240" height="84" rx="12" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.2" filter="url(#softGlow)" opacity="0.9" />
      <circle cx="26" cy="30" r="10" fill="#818cf8" opacity="0.2" />
      <circle cx="26" cy="30" r="4" fill="#818cf8" class="pulsing-node" />
      <text x="46" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">MASS APPRAISAL ENGINE</text>
      <text x="24" y="64" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800">1.8M+ <tspan fill="#818cf8" font-size="13" font-weight="600">Parcels</tspan></text>
      <text x="145" y="64" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">LightGBM + GIS</text>
    </g>
  </g>

  <!-- FOREGROUND BRANDING & HEADER CONTENT (HIGH CONTRAST, FULLY VISIBLE, UNOBSTRUCTED) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 52)">
      <rect width="270" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#10b981" class="pulsing-node" />
      <text x="30" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CURATED PROPTELOGY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8">
      Strategic Real Estate Valuation
    </text>
    <text x="0" y="174" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Models, AVMs &amp; Analytics
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="214" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      The authoritative guide to SaaS platforms &amp; open-source property appraisal infrastructure.
    </text>

    <!-- Interactive / Feature Badges / Category Pills in Foreground -->
    <g transform="translate(0, 252)">
      <!-- Pill 1: AVM & Mass Appraisal -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95" />
        <text x="16" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">🏢 Automated Valuation</text>
      </g>

      <!-- Pill 2: Commercial & Residential -->
      <g transform="translate(192, 0)">
        <rect width="175" height="38" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.95" />
        <text x="16" y="24" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">📈 Mass Appraisal ML</text>
      </g>

      <!-- Pill 3: Hedonic & Spatial -->
      <g transform="translate(379, 0)">
        <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.95" />
        <text x="16" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">🗺️ Spatial &amp; Hedonic</text>
      </g>

      <!-- Pill 4: Open-Source Stack -->
      <g transform="translate(556, 0)">
        <rect width="150" height="38" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1" opacity="0.95" />
        <text x="16" y="24" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">⚡ Open Architecture</text>
      </g>
    </g>
  </g>

  <!-- ACCENT CORNER BOTTOM LINE -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#primaryGlow)" stroke-width="3" opacity="0.8" />
</svg>
